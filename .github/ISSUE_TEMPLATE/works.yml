name: It works on my setup
description: Tell us a browser, machine or site where it ran fine. This is how it gets tested beyond one computer.
labels: ["works-for-me"]
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - Other Chromium browser (write which below)
    validations:
      required: true
  - type: dropdown
    id: machine
    attributes:
      label: Computer
      options:
        - Windows on x64 (Intel / AMD)
        - Windows on ARM64 (Snapdragon / Surface)
        - Mac with Apple silicon (M1 or later)
        - Mac with Intel
        - Linux
        - Not sure
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: What you ran
      description: The sites and goals that worked, one per line. Leave out anything private.
      placeholder: |
        ynet.co.il — "פתח את מדור הכלכלה"
        ksp.co.il — "search the site for Bluetooth headphones"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Something slow, confusing in the setup, or worth adding to the README.
